[project]
name = "advisor"
version = "0.1.0"
description = "股票投资顾问 Agent V6：可追溯研究、多专家深研、受控自进化、个人情境与前向模拟"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-mongodb>=0.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "httpx>=0.27",
    "akshare>=1.16",
    "pandas>=2.2",
    "pymongo>=4.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = ["pytest>=8", "mongomock>=4.2", "respx>=0.21"]

[project.scripts]
advisor = "advisor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock"]
